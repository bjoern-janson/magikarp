name: benchmark-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install "setuptools>=69"
          python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic engineering smoke
        run: magikarp smoke --output "$RUNNER_TEMP/magikarp-smoke"
      - name: Assert smoke boundary
        run: >-
          python -c "import json, os, pathlib;
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'magikarp-smoke'/'summary.json';
          s=json.loads(p.read_text());
          assert s['status']=='engineering_only';
          assert s['evidence_bearing'] is False;
          assert s['generator_scope']['evidence_ready'] is False;
          assert s['validity']['all_passed'] is True"
